<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Habitaciones | Residencia Geriátrica</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<header class="barra-superior">
    <div class="contenedor barra-contenido">
        <h2>Residencia Geriátrica</h2>
        <a th:href="@{/}">Menú principal</a>
    </div>
</header>

<main class="contenedor">

    <div class="encabezado-seccion">

        <div>
            <h1>Gestión de habitaciones</h1>
            <p>Administración y consulta de habitaciones.</p>
        </div>

        <!-- ALTA DE HABITACION -->
        <form th:action="@{/habitaciones/guardar}" method="post">

            <button class="boton boton-primario" type="submit">
                + Nueva habitación
            </button>

        </form>

    </div>

    <!-- MENSAJES -->
    <div class="mensaje exito"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="mensaje error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- FILTROS -->
    <div class="filtros">

        <a class="boton boton-secundario"
           th:href="@{/habitaciones}">
            Todas
        </a>

        <a class="boton boton-secundario"
           th:href="@{/habitaciones(estado='LIBRE')}">
            Libres
        </a>

        <a class="boton boton-secundario"
           th:href="@{/habitaciones(estado='OCUPADA')}">
            Ocupadas
        </a>

    </div>

    <!-- LISTADO -->
    <div class="tarjeta">

        <table>

            <thead>
                <tr>
                    <th>Código</th>
                    <th>Estado</th>
                    <th>Residente</th>
                    <th>Enfermero</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="habitacion : ${habitaciones}">

                    <td th:text="${habitacion.codigo}"></td>

                    <!-- ESTADO -->
                    <td>
                        <span class="estado"
                              th:classappend="${habitacion.estado.name() == 'LIBRE'} ? 'estado-libre' : 'estado-ocupada'"
                              th:text="${habitacion.estado}">
                        </span>
                    </td>

                    <!-- RESIDENTE -->
                    <td>
                        <span th:if="${habitacion.residente != null}"
                              th:text="${habitacion.residente.nombre + ' ' + habitacion.residente.apellido}">
                        </span>

                        <span th:unless="${habitacion.residente != null}">
                            Sin residente
                        </span>
                    </td>

                    <!-- ENFERMERO -->
                    <td>
                        <span th:if="${habitacion.enfermero != null}"
                              th:text="${habitacion.enfermero.nombre + ' ' + habitacion.enfermero.apellido}">
                        </span>

                        <span th:unless="${habitacion.enfermero != null}">
                            Sin enfermero
                        </span>
                    </td>

                    <!-- ACCIONES -->
                    <td>

                        <div class="acciones">

                            <a class="boton boton-secundario"
                               th:href="@{/habitaciones/detalle/{codigo}(codigo=${habitacion.codigo})}">
                                Ver detalle
                            </a>

                            <form th:action="@{/habitaciones/eliminar/{codigo}(codigo=${habitacion.codigo})}"
                                  method="post"
                                  onsubmit="return confirm('¿Eliminar esta habitación?');">

                                <button class="boton boton-peligro"
                                        type="submit">
                                    Eliminar
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                <!-- LISTA VACIA -->
                <tr th:if="${#lists.isEmpty(habitaciones)}">

                    <td colspan="5" class="tabla-vacia">
                        No se encontraron habitaciones.
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
