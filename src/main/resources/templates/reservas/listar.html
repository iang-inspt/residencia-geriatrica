<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reservas | Residencia Geriátrica</title>

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<header class="barra-superior">
    <div class="contenedor barra-contenido">
        <h2>Residencia Geriátrica</h2>
        <a th:href="@{/}">Menú principal</a>
    </div>
</header>

<main class="contenedor">

    <div class="encabezado-seccion">

        <div>
            <h1>Gestión de reservas</h1>
            <p>Administración de habitaciones ocupadas por residentes.</p>
        </div>

        <a class="boton boton-primario"
           th:href="@{/reservas/nueva}">
            + Nueva reserva
        </a>

    </div>

    <!-- MENSAJES -->
    <div class="mensaje exito"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="mensaje error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- LISTADO DE RESERVAS -->
    <div class="tarjeta">

        <table>

            <thead>
                <tr>
                    <th>Habitación</th>
                    <th>ID Residente</th>
                    <th>Residente</th>
                    <th>DNI</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="habitacion : ${reservas}">

                    <td th:text="${habitacion.codigo}"></td>

                    <td th:text="${habitacion.residente.id}"></td>

                    <td th:text="${habitacion.residente.nombre + ' ' + habitacion.residente.apellido}"></td>

                    <td th:text="${habitacion.residente.dni}"></td>

                    <td>
                        <span class="estado estado-ocupada">
                            OCUPADA
                        </span>
                    </td>

                    <td>
                        <div class="acciones">

                            <a class="boton boton-secundario"
                               th:href="@{/habitaciones/detalle/{codigo}(codigo=${habitacion.codigo})}">
                                Ver detalle
                            </a>

                            <form th:action="@{/reservas/cancelar/{codigo}(codigo=${habitacion.codigo})}"
                                  method="post"
                                  onsubmit="return confirm('¿Cancelar esta reserva?');">

                                <button class="boton boton-peligro"
                                        type="submit">
                                    Cancelar reserva
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(reservas)}">

                    <td colspan="6" class="tabla-vacia">
                        No hay reservas activas.
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
